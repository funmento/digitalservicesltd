<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Form detection</title></head>
  <body>
    <form name="project-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-enquiry">
      <input name="bot-field">
      <input name="name">
      <input name="email" type="email">
      <input name="business-name">
      <input name="phone">
      <select name="budget-range"><option>Not specified</option></select>
      <textarea name="project-requirements"></textarea>
    </form>
  </body>
</html>
